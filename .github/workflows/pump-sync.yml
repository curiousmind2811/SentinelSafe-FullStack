name: Auto Pattern Sync (Pump)

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch: 

jobs:
  sync-patterns:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        # 'working-directory' batata hai ki commands gateway folder mein chalani hain
        working-directory: ./gateway 
        run: |
          npm install
          npx prisma generate

      - name: Run Pump Script
        working-directory: ./gateway
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NET_ENGINE_URL: ${{ secrets.NET_ENGINE_URL }}
        run: node pump.js